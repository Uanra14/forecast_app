{% extends "layout.html" %}

{% block title %}
    Welcome Page
{% endblock %}

{% block main %}
    <h1> This page shows the Past Prices of the Day Ahead Market </h1>
    <div id="plot"></div>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
        var plot_data = JSON.parse('{{ figure_json | safe }}');
        Plotly.newPlot('plot', plot_data.data, plot_data.layout);
    </script>

{% endblock %}
